wifi:
  ssid: MySSID
  password: password1

api:

litter_robot3:
  id: my_litter_robot3

text_sensor:
  - platform: litter_robot3
    type: status
    name: "Status"
  - platform: litter_robot3
    type: power_type
    name: "Power Type"

sensor:
  - platform: litter_robot3
    type: waste_drawer_cycle_count
    name: "Waste Drawer Cycles"

select:
  - platform: litter_robot3
    type: cycle_delay
    name: "Cycle Delay"

switch:
  - platform: litter_robot3
    type: power
    name: "Power"
  - platform: litter_robot3
    type: night_light
    name: "Night Light"
  - platform: litter_robot3
    type: panel_lockout
    name: "Panel Lockout"
  - platform: litter_robot3
    type: sleep
    name: "Sleep"

button:
  - platform: litter_robot3
    type: cycle
    name: "Manual Cycle"
  - platform: litter_robot3
    type: factory_reset
    name: "Factory Reset"

interval:
  - interval: 24h
    then:
      - litter_robot3.set_sleep:
          offset: 3600
