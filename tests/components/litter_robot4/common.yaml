litter_robot4:
  id: my_litter_robot4
  cat_weight_tolerance: 1.0
  reduce_false_detections: true

text_sensor:
  - platform: litter_robot4
    type: status
    name: "Status"
  - platform: litter_robot4
    type: power_type
    name: "Power Type"

sensor:
  - platform: litter_robot4
    type: waste_drawer_level
    name: "Waste Drawer Level"
  - platform: litter_robot4
    type: litter_level
    name: "Litter Level"
  - platform: litter_robot4
    type: last_cat_weight
    name: "Cat Weight"
  - platform: litter_robot4
    type: cat_visit_count
    name: "Neji Visits"
    cat_weight: neji
  - platform: litter_robot4
    type: cat_visit_count
    name: "Pubert Visits"
    cat_weight: pubert
  - platform: litter_robot4
    type: clean_cycle_count
    name: "Clean Cycles"
  - platform: litter_robot4
    type: power_cycle_count
    name: "Power Cycles"
  - platform: litter_robot4
    type: empty_cycle_count
    name: "Empty Cycles"
  - platform: litter_robot4
    type: filter_cycle_count
    name: "Filter Cycles"

button:
  - platform: litter_robot4
    type: cycle
    name: "Manual Cycle"
  - platform: litter_robot4
    type: empty
    name: "Empty Litter"
  - platform: litter_robot4
    type: replace_filter
    name: "Replace Filter"
  - platform: litter_robot4
    type: factory_reset
    name: "Factory Reset"
  - platform: litter_robot4
    type: reset
    name: "Reset"

number:
  - platform: litter_robot4
    type: clean_cycle_delay
    name: "Clean Cycle Delay"
  - platform: litter_robot4
    type: cat_weight
    id: neji
    name: "Neji Weight"
  - platform: litter_robot4
    type: cat_weight
    id: pubert
    name: "Pubert Weight"

select:
  - platform: litter_robot4
    type: night_light_mode
    name: "Night Light Mode"
  - platform: litter_robot4
    type: night_light_brightness
    name: "Night Light Brightness"
  - platform: litter_robot4
    type: panel_brightness
    name: "Panel Brightness"

switch:
  - platform: litter_robot4
    type: control_panel_lockout
    name: "Control Panel Lockout"
  - platform: litter_robot4
    type: sleep_schedule_sun
    name: "Sunday Sleep Schedule"
  - platform: litter_robot4
    type: sleep_schedule_mon
    name: "Monday Sleep Schedule"
  - platform: litter_robot4
    type: power
    name: "Power"

datetime:
  - platform: litter_robot4
    type: sleep_sun
    name: "Sunday Sleep Time"
  - platform: litter_robot4
    type: wake_sun
    name: "Sunday Wake Time"
  - platform: litter_robot4
    type: sleep_mon
    name: "Monday Sleep Time"

binary_sensor:
  - platform: litter_robot4
    type: waste_drawer_full
    name: "Waste Drawer Full"
  - platform: litter_robot4
    type: bonnet_removed
    name: "Bonnet Removed"
  - platform: litter_robot4
    type: night_light
    name: "Night Light"
  - platform: litter_robot4
    type: sleep_status
    name: "Sleep Status"
  - platform: litter_robot4
    type: fault_status
    name: "Fault Status"
  - platform: litter_robot4
    type: laser_detect
    name: "Laser Detect"
  - platform: litter_robot4
    type: weight_detect
    name: "Weight Detect"
